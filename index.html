<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسیر یادگیری من</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2fb;--card:#fff;--ink:#1a1a3a;--mute:#6b6b8f;--line:#dcdaf0;--accent:#5b4bff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12122b;--card:#1c1c3c;--ink:#f1f0ff;--mute:#9a99c4;--line:#2d2d5a;--accent:#7ef2c8}}
:root[data-theme="dark"]{--bg:#12122b;--card:#1c1c3c;--ink:#f1f0ff;--mute:#9a99c4;--line:#2d2d5a;--accent:#7ef2c8}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.8}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh;max-width:1100px;margin:auto}
aside{padding:18px;border-left:1px solid var(--line)}
h1{font-size:1.25rem;font-weight:800;margin:0 0 14px}
.sub{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;text-align:right;margin-bottom:6px;border:2px solid transparent}
.sub.on{background:var(--card);border-color:var(--c)}
.sub .e{font-size:1.4rem}.sub .n{flex:1;font-weight:600}.sub .p{font-size:.8rem;color:var(--mute)}
.add{display:flex;gap:6px;margin-top:10px}
.add input,.field{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:8px 14px;font-weight:600}
:root[data-theme="dark"] .btn{color:#12122b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#12122b}}
.ghost{color:var(--mute);padding:6px 10px;border-radius:10px;border:1px solid var(--line);font-size:.85rem}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
main{padding:22px 24px 60px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .e{font-size:2.4rem}.head h2{margin:0;font-size:1.6rem;font-weight:800;flex:1}
.bar{height:10px;border-radius:99px;background:var(--line);margin:14px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .4s}
.path{position:relative;margin:18px 0}
.path:before{content:"";position:absolute;right:21px;top:10px;bottom:10px;width:3px;background:var(--line)}
.les{position:relative;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.node{z-index:1;flex:none;width:44px;height:44px;border-radius:50%;background:var(--card);border:3px solid var(--c);font-weight:800;display:grid;place-items:center}
.les.done .node{background:var(--c);color:#12122b}
.lc{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;text-align:right}
.lc b{flex:1;font-weight:600}.les.done .lc b{text-decoration:line-through;color:var(--mute)}
.meta{font-size:.8rem;color:var(--mute)}
.mv{display:flex;flex-direction:column}.mv button{color:var(--mute);line-height:1;padding:2px 6px}
.ed input.t{width:100%;font-size:1.4rem;font-weight:800;background:none;border:0;border-bottom:2px solid var(--c);padding:6px 0;margin:12px 0}
.ed textarea{width:100%;min-height:260px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;resize:vertical;line-height:2}
.task{display:flex;gap:10px;align-items:center;padding:6px 0}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--c)}
.task span{flex:1}.task.d span{text-decoration:line-through;color:var(--mute)}
h3{margin:22px 0 6px}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.chips{display:none}

/* --- توضیح کلمه‌ها (پاپ‌آپ) --- */
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.hint{font-size:.8rem;color:var(--mute);margin:4px 0 10px}
.read{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;line-height:2.2;white-space:pre-wrap;min-height:120px;overflow-wrap:anywhere}
.term{display:inline;padding:0 5px;border-radius:6px;border-bottom:2px dashed var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);font-weight:600;line-height:inherit;text-align:inherit}
.term.has{border-bottom-style:solid}
.md{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,10,30,.6)}
.md[hidden]{display:none}
.sheet{width:min(520px,100%);max-height:85vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.sheet h4{margin:0 0 10px;font-size:1.15rem;font-weight:800}
.sheet textarea{width:100%;min-height:160px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;line-height:2}
.mview{white-space:pre-wrap;line-height:2;overflow-wrap:anywhere}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}

@media (max-width:760px){
 .app{display:block}
 aside{border:0;padding:14px}
 .sub{display:inline-flex;width:auto;margin-left:6px}
 .list{white-space:nowrap;overflow-x:auto;padding-bottom:6px}
 main{padding:10px 14px 60px}
 .md{place-items:end center;padding:0}
 .sheet{border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <aside>
  <h1>🧭 مسیر یادگیری من</h1>
  <div class="list" id="subs"></div>
  <form class="add" id="addSub"><input id="subName" placeholder="درس / موضوع جدید" aria-label="نام موضوع"><button class="btn">افزودن</button></form>
  <div class="tools">
   <button class="ghost" id="cfgBtn">☁ گوگل شیت</button>
   <button class="ghost" id="theme">🌓 تم</button>
   <button class="ghost" id="exp">⬇ پشتیبان</button>
   <label class="ghost" style="cursor:pointer">⬆ بازیابی<input type="file" id="imp" accept=".json" hidden></label>
  </div>
  <p class="meta" id="syncSt" aria-live="polite"></p>
  <form id="cfg" hidden style="display:grid;gap:6px;margin-top:8px">
   <input class="field" id="cu" placeholder="آدرس Web app (…/exec)" dir="ltr">
   <input class="field" id="ck" placeholder="رمز" dir="ltr">
   <button class="btn">اتصال و همگام‌سازی</button>
  </form>
 </aside>
 <main id="main"></main>
</div>

<div class="md" id="md" hidden>
 <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
  <h4 id="mt"></h4>
  <div class="mview" id="mvw" hidden></div>
  <textarea id="mx" placeholder="توضیح این کلمه رو بنویس..." hidden></textarea>
  <div class="row">
   <button class="btn" id="ms">ذخیره</button>
   <button class="ghost" id="me" hidden>✏️ ویرایش</button>
   <button class="ghost" id="mdl">🗑 حذف توضیح</button>
   <button class="ghost" id="mc">بستن</button>
  </div>
 </div>
</div>

<script>
const KEY="learn-path-v1",COLORS=["#7ef2c8","#ff6b8a","#ffc857","#6ea8ff","#c792ff","#ff9f6b"],EMO=["📘","🧪","🎭","💻","🧠","🎨","🌍","⚡"];
let S={subs:[],sel:null,open:null,read:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.open=null;S.read=false;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const local=()=>{try{localStorage.setItem(KEY,JSON.stringify({subs:S.subs,sel:S.sel}))}catch(e){}};
const save=()=>{local();queueSync()};
const cur=()=>S.subs.find(s=>s.id===S.sel);
const prog=s=>s.les.length?Math.round(100*s.les.filter(l=>l.done).length/s.les.length):0;
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
let armed=null;

/* متن مبحث را با کلمه‌های علامت‌دار [[کلمه]] به دکمهٔ کلیک‌پذیر تبدیل می‌کند */
function rich(l){
 let out="",last=0,m;const re=/\[\[([^\[\]]+?)\]\]/g;
 while((m=re.exec(l.b))){
  out+=esc(l.b.slice(last,m.index));
  const k=m[1].trim();
  out+=`<button class="term${l.w[k]?" has":""}" data-a="term" data-w="${esc(k)}">${esc(k)}</button>`;
  last=re.lastIndex;
 }
 return out+esc(l.b.slice(last));
}

function render(){
 document.getElementById("subs").innerHTML=S.subs.map(s=>`<button class="sub ${s.id===S.sel?"on":""}" style="--c:${s.c}" data-a="pick" data-id="${s.id}"><span class="e">${s.e}</span><span class="n">${esc(s.n)}</span><span class="p">${fa(prog(s))}٪</span></button>`).join("");
 const m=document.getElementById("main"),s=cur();
 if(!s){m.innerHTML=`<div class="empty"><div style="font-size:3rem">🌱</div><p>هنوز موضوعی نداری.<br>اولین درست رو از کنار صفحه اضافه کن، مثلاً «معادلات دیفرانسیل».</p></div>`;return}
 const c=`style="--c:${s.c}"`;
 if(S.open){
  const l=s.les.find(x=>x.id===S.open);if(!l){S.open=null;return render()}
  l.w=l.w||{};
  m.innerHTML=`<div class="ed" ${c}>
   <button class="ghost" data-a="back">→ برگشت به ${esc(s.n)}</button>
   <input class="t" id="lt" value="${esc(l.t)}" aria-label="عنوان مبحث">
   <div class="tb">
    <button class="ghost" data-a="rd">${S.read?"✏️ ویرایش متن":"📖 حالت خواندن"}</button>
    ${S.read?"":`<button class="ghost" data-a="wrap">🔗 توضیح برای کلمهٔ انتخاب‌شده</button>`}
   </div>
   <p class="hint" id="hint">${S.read?"روی کلمه‌های رنگی بزن تا توضیحشون باز بشه.":"یه کلمه رو توی متن انتخاب کن و دکمهٔ 🔗 رو بزن (یا دستی بنویس: [[کلمه]])."}</p>
   ${S.read
    ?`<div class="read" id="lr">${rich(l)||'<span class="meta">هنوز متنی ننوشتی.</span>'}</div>`
    :`<textarea id="lb" placeholder="اینجا بنویس: چیزی که از گوگل یا کتاب یاد گرفتی...">${esc(l.b)}</textarea>`}
   <h3>✅ چک‌لیست</h3>
   <div>${l.k.map((k,i)=>`<div class="task ${k.d?"d":""}"><input type="checkbox" data-a="tk" data-i="${i}" ${k.d?"checked":""}><span>${esc(k.t)}</span><button class="ghost" data-a="tdel" data-i="${i}" aria-label="حذف">✕</button></div>`).join("")}</div>
   <form class="add" id="addTask"><input id="tn" placeholder="مورد جدید برای چک‌لیست"><button class="btn">افزودن</button></form>
   <p style="margin-top:22px"><button class="btn" data-a="fin">${l.done?"↺ دوباره بازش کن":"✔ این مبحث تموم شد"}</button>
   <button class="ghost" data-a="ldel">${armed==="l"?"مطمئنی؟ دوباره بزن":"🗑 حذف مبحث"}</button></p></div>`;
  document.getElementById("lt").oninput=e=>{l.t=e.target.value;save()};
  const lb=document.getElementById("lb");
  if(lb)lb.oninput=e=>{l.b=e.target.value;save()};
  document.getElementById("addTask").onsubmit=e=>{e.preventDefault();const v=tn.value.trim();if(v){l.k.push({t:v,d:false});save();render();document.getElementById("tn").focus()}};
  return;
 }
 m.innerHTML=`<div ${c}><div class="head"><span class="e">${s.e}</span><h2>${esc(s.n)}</h2>
  <button class="ghost" data-a="sdel">${armed==="s"?"مطمئنی؟ دوباره بزن":"🗑 حذف درس"}</button></div>
  <div class="bar"><i style="width:${prog(s)}%"></i></div>
  <form class="add" id="addLes"><input id="ln" placeholder="مبحث جدید به ترتیب (مثلاً: فصل ۱ – مفاهیم پایه)"><button class="btn">افزودن مبحث</button></form>
  <div class="path">${s.les.length?s.les.map((l,i)=>`<div class="les ${l.done?"done":""}"><div class="node">${l.done?"✓":fa(i+1)}</div>
   <button class="lc" data-a="open" data-id="${l.id}"><b>${esc(l.t)}</b><span class="meta">${fa(l.k.filter(k=>k.d).length)}/${fa(l.k.length)} مورد</span></button>
   <div class="mv"><button data-a="up" data-i="${i}" aria-label="بالا">▲</button><button data-a="dn" data-i="${i}" aria-label="پایین">▼</button></div></div>`).join(""):`<div class="empty">هنوز مبحثی نداری. اولی رو بالا بنویس.</div>`}</div></div>`;
 document.getElementById("addLes").onsubmit=e=>{e.preventDefault();const v=ln.value.trim();if(v){s.les.push({id:uid(),t:v,b:"",k:[],w:{},done:false});save();render();document.getElementById("ln").focus()}};
}

/* ---------- پاپ‌آپ توضیح کلمه ---------- */
const md=document.getElementById("md"),mt=document.getElementById("mt"),mx=document.getElementById("mx"),
 mvw=document.getElementById("mvw"),ms=document.getElementById("ms"),me=document.getElementById("me"),
 mdl=document.getElementById("mdl"),mc=document.getElementById("mc");
let MK=null;
const curLes=()=>{const s=cur();return s&&S.open?s.les.find(x=>x.id===S.open):null};
function showView(t){mvw.textContent=t;mvw.hidden=false;mx.hidden=true;ms.hidden=true;me.hidden=false}
function showEdit(t){mx.value=t;mvw.hidden=true;mx.hidden=false;ms.hidden=false;me.hidden=true;mx.focus()}
function openTerm(k){
 const l=curLes();if(!l)return;
 l.w=l.w||{};MK=k;mt.textContent=k;md.hidden=false;
 const t=l.w[k]||"";
 if(t)showView(t);else showEdit("");
}
function closeM(){md.hidden=true;MK=null}
ms.onclick=()=>{
 const l=curLes();if(!l||MK==null)return;
 const v=mx.value.trim();
 if(v)l.w[MK]=v;else delete l.w[MK];
 save();closeM();render();
};
me.onclick=()=>{const l=curLes();if(l&&MK!=null)showEdit(l.w[MK]||"")};
mdl.onclick=()=>{
 const l=curLes();if(!l||MK==null)return;
 delete l.w[MK];
 l.b=l.b.split("[["+MK+"]]").join(MK);   /* علامت [[ ]] هم برداشته می‌شه */
 save();closeM();render();
};
mc.onclick=closeM;
md.onclick=e=>{if(e.target===md)closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!md.hidden)closeM()});

/* کلمهٔ انتخاب‌شده در متن را به [[کلمه]] تبدیل می‌کند و پاپ‌آپ را باز می‌کند */
function wrapSel(l){
 const t=document.getElementById("lb");if(!t||!l)return;
 const x=t.selectionStart,y=t.selectionEnd,raw=t.value.slice(x,y),w=raw.trim();
 const hint=document.getElementById("hint");
 if(!w){if(hint)hint.textContent="⚠ اول کلمه یا عبارت رو توی متن انتخاب کن، بعد این دکمه رو بزن.";return}
 if(/\[\[|\]\]/.test(w)){if(hint)hint.textContent="⚠ توی انتخابت از قبل علامت [[ ]] هست.";return}
 const lead=raw.match(/^\s*/)[0],trail=raw.match(/\s*$/)[0];
 l.b=t.value.slice(0,x)+lead+"[["+w+"]]"+trail+t.value.slice(y);
 t.value=l.b;save();openTerm(w);
}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,s=cur(),i=+b.dataset.i;
 const l=s&&S.open?s.les.find(x=>x.id===S.open):null;
 if(a==="rd"){S.read=!S.read;render();return}
 if(a==="term"){openTerm(b.dataset.w);return}
 if(a==="wrap"){wrapSel(l);return}
 if(a==="pick"){S.sel=b.dataset.id;S.open=null;armed=null}
 else if(a==="open"){S.open=b.dataset.id;S.read=false}
 else if(a==="back"){S.open=null;armed=null}
 else if(a==="tk")l.k[i].d=!l.k[i].d;
 else if(a==="tdel")l.k.splice(i,1);
 else if(a==="fin"){l.done=!l.done;if(l.done)S.open=null}
 else if(a==="up"&&i>0)[s.les[i-1],s.les[i]]=[s.les[i],s.les[i-1]];
 else if(a==="dn"&&i<s.les.length-1)[s.les[i+1],s.les[i]]=[s.les[i],s.les[i+1]];
 else if(a==="ldel"){if(armed!=="l"){armed="l"}else{s.les=s.les.filter(x=>x.id!==S.open);S.open=null;armed=null}}
 else if(a==="sdel"){if(armed!=="s"){armed="s"}else{S.subs=S.subs.filter(x=>x.id!==S.sel);S.sel=S.subs[0]?.id||null;armed=null}}
 save();render();
});
document.getElementById("addSub").onsubmit=e=>{e.preventDefault();const v=subName.value.trim();if(!v)return;
 const n=S.subs.length;S.subs.push({id:uid(),n:v,e:EMO[n%EMO.length],c:COLORS[n%COLORS.length],les:[]});
 S.sel=S.subs[n].id;S.open=null;subName.value="";save();render()};
document.getElementById("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark";try{localStorage.setItem(KEY+"-t",r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem(KEY+"-t");if(t)document.documentElement.dataset.theme=t}catch(e){}
document.getElementById("exp").onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({subs:S.subs,sel:S.sel})],{type:"application/json"}));
 const a=document.createElement("a");a.href=u;a.download="learning-backup.json";a.click()};
document.getElementById("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.subs)){S.subs=d.subs;S.sel=d.sel||d.subs[0]?.id||null;save();render()}}catch(x){}};r.readAsText(f)};

let CFG={};try{CFG=JSON.parse(localStorage.getItem(KEY+"-cfg")||"{}")}catch(e){}
const st=t=>{document.getElementById("syncSt").textContent=t};let tm;
function queueSync(){if(!CFG.u)return;clearTimeout(tm);st("⏳ در حال ذخیره...");tm=setTimeout(push,1500)}
async function push(){try{const r=await fetch(CFG.u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:CFG.k,subs:S.subs})});const j=await r.json();st(j.ok?"☁ در گوگل شیت ذخیره شد":"⚠ "+(j.error||"خطا"))}catch(e){st("⚠ اتصال برقرار نشد")}}
async function pull(){if(!CFG.u)return;st("⏳ در حال اتصال...");try{const r=await fetch(CFG.u+"?key="+encodeURIComponent(CFG.k));const j=await r.json();
 if(j.error){st("⚠ رمز اشتباه است");return}
 if(j.subs&&j.subs.length){S.subs=j.subs;if(!S.subs.find(x=>x.id===S.sel))S.sel=S.subs[0].id;S.open=null;local();render();st("☁ همگام شد")}
 else if(S.subs.length)await push();else st("☁ وصل شد")}catch(e){st("⚠ اتصال برقرار نشد")}}
const cf=document.getElementById("cfg");
document.getElementById("cfgBtn").onclick=()=>{cf.hidden=!cf.hidden;document.getElementById("cu").value=CFG.u||"";document.getElementById("ck").value=CFG.k||""};
cf.onsubmit=e=>{e.preventDefault();CFG={u:cu.value.trim(),k:ck.value};try{localStorage.setItem(KEY+"-cfg",JSON.stringify(CFG))}catch(x){}cf.hidden=true;pull()};
if(!S.sel&&S.subs[0])S.sel=S.subs[0].id;
render();pull();
</script>
</body>
</html>
